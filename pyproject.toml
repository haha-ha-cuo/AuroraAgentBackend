[project]
name = "auroraapp"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "rich>=15.0.0",
]

[project.scripts]
aurora = "aurora.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aurora*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
